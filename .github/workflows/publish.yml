name: Publish to npm

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Dry run (skip actual publish)"
        type: boolean
        default: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$TAG_VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag v$TAG_VERSION matches package.json"

      - name: Assert tarball includes runtime-critical paths
        # Catches the class of bug where `files` allowlist drops a runtime path
        # (e.g. v1.0.0 shipped without mcp.json/skills/). npm pack will succeed
        # silently with a slimmer tarball; this step turns that into a CI fail.
        run: |
          set -euo pipefail
          npm pack
          TARBALL=$(ls hieutrtr-claude-bridge-*.tgz | head -1)
          echo "::group::Tarball contents ($TARBALL)"
          tar -tzf "$TARBALL" | sort
          echo "::endgroup::"
          tar -tzf "$TARBALL" | sort > /tmp/tarball-files.txt

          REQUIRED=(
            "package/package.json"
            "package/README.md"
            "package/CHANGELOG.md"
            "package/LICENSE"
            "package/mcp.json"
            "package/.claude-plugin/plugin.json"
            "package/skills/dispatch.md"
            "package/skills/status.md"
            "package/skills/loop-review.md"
            "package/skills/loop-code-review.md"
            "package/assets/hero-flow.jpg"
            "package/src/cli/index.ts"
            "package/src/mcp/server.ts"
            "package/src/execution/notify.ts"
            "package/src/channel/telegram/format.ts"
            "package/src/channel/telegram/markdown-to-html.ts"
          )

          MISSING=()
          for path in "${REQUIRED[@]}"; do
            if ! grep -qxF "$path" /tmp/tarball-files.txt; then
              MISSING+=("$path")
            fi
          done

          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "::error::Tarball is missing $(( ${#MISSING[@]} )) required path(s):"
            printf '::error::  %s\n' "${MISSING[@]}"
            echo ""
            echo "Update the \`files\` allowlist in package.json to include these paths."
            exit 1
          fi
          echo "All ${#REQUIRED[@]} required paths present in tarball."

  publish:
    name: Publish
    needs: verify
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.dry-run == false)
    permissions:
      contents: read
      id-token: write
    environment:
      name: npm
      url: https://www.npmjs.com/package/@hieutrtr/claude-bridge
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Node (for npm CLI)
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Publish to npm
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
